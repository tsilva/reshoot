name: Production delivery

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/production-delivery.yml
      - lib/auth/config.ts
      - tests/production-auth-config.test.ts
  workflow_dispatch:
    inputs:
      stage_prebuilt:
        description: Stage and verify a GitHub-built artifact without changing production domains
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-secret-delivery
  cancel-in-progress: false

jobs:
  secrets:
    name: Check committed secrets before production delivery
    uses: ./.github/workflows/secret-scanning.yml

  deliver:
    needs: secrets
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: tsilva/.github/.github/workflows/production-delivery.yml@48a4449de4ac5f4d5e14343f70fe5fc57bc2cd74
    with:
      sync_only: ${{ inputs.stage_prebuilt }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  stage_prebuilt:
    needs: deliver
    if: github.ref == 'refs/heads/main' && inputs.stage_prebuilt
    uses: tsilva/.github/.github/workflows/vercel-prebuilt.yml@ff72a05772d5d5546fa1cdfd89054125caa484b8
    with:
      project_id: prj_L1D4dlxsUv8zZORHmxEmDZnE3lCV
      project_name: reshoot
      production_domains: '["reshoot.tsilva.eu","reshoot-zeta.vercel.app"]'
      public_environment: '["NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY","NEXT_PUBLIC_GOOGLE_ANALYTICS_ID","NEXT_PUBLIC_SENTRY_DSN","SENTRY_ORG","SENTRY_PROJECT","R2_ENDPOINT"]'
      source_maps: true
      verify_clerk_runtime: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
