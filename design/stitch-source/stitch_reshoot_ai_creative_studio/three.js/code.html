<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create the orbit sphere (wireframe with dots)
const geometry = new THREE.SphereGeometry(2, 32, 32);
const material = new THREE.MeshPhongMaterial({
    color: 0x0A1128, // Deep ink
    wireframe: true,
    transparent: true,
    opacity: 0.1
});
const sphere = new THREE.Mesh(geometry, material);
scene.add(sphere);

// Add camera pins (Coral)
const pins = [];
const pinCount = 6;
const coral = 0xFF6B4E;

for (let i = 0; i < pinCount; i++) {
    const pinGeo = new THREE.SphereGeometry(0.1, 16, 16);
    const pinMat = new THREE.MeshPhongMaterial({ color: coral });
    const pin = new THREE.Mesh(pinGeo, pinMat);

    // Random positions for demo
    const phi = Math.acos(-1 + (2 * i) / pinCount);
    const theta = Math.sqrt(pinCount * Math.PI) * phi;

    pin.position.setFromSphericalCoords(2, phi, theta);
    sphere.add(pin);
}

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xffffff, 1);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Interaction
let isDragging = false;
let previousMouseX = 0;
let previousMouseY = 0;

container.addEventListener('mousedown', (e) => { isDragging = true; });
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const deltaX = e.clientX - previousMouseX;
        const deltaY = e.clientY - previousMouseY;
        sphere.rotation.y += deltaX * 0.01;
        sphere.rotation.x += deltaY * 0.01;
    }
    previousMouseX = e.clientX;
    previousMouseY = e.clientY;
});

// Touch support
container.addEventListener('touchstart', (e) => {
    isDragging = true;
    previousMouseX = e.touches[0].clientX;
    previousMouseY = e.touches[0].clientY;
});
window.addEventListener('touchend', () => { isDragging = false; });
window.addEventListener('touchmove', (e) => {
    if (isDragging) {
        const deltaX = e.touches[0].clientX - previousMouseX;
        const deltaY = e.touches[0].clientY - previousMouseY;
        sphere.rotation.y += deltaX * 0.01;
        sphere.rotation.x += deltaY * 0.01;
        previousMouseX = e.touches[0].clientX;
        previousMouseY = e.touches[0].clientY;
    }
});

function animate() {
    requestAnimationFrame(animate);
    if (!isDragging) {
        sphere.rotation.y += 0.002;
    }
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->
</body>
</html>
